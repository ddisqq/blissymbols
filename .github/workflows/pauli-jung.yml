name: pauli-jung

on:
  push:
    paths: ["pauli-jung/**", "pauli-jung-prob/**", "bliss3d/**", "blissdata_*.js", ".github/workflows/pauli-jung.yml"]
  pull_request:
    paths: ["pauli-jung/**", "pauli-jung-prob/**", "bliss3d/**", "blissdata_*.js", ".github/workflows/pauli-jung.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pauli-jung
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check all proofs and the axiom audit
        run: lake build
      - name: Run the case report
        run: lake exe paulijung
      - name: Analyse the example world files
        run: |
          lake exe paulijung examples/scarab.world
          lake exe paulijung examples/bookcase.world
          ! lake exe paulijung examples/broken.world
      - name: Check that the generated Blissymbol files are current
        run: |
          node tools/gen_bliss_lean.js
          git diff --exit-code -- Bliss/Data.lean ../bliss3d/bliss3d_paths.js
          lake exe blissexport | diff - ../bliss3d/bliss3d_data.js

  mathlib-companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pauli-jung-prob
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the Mathlib build cache
        run: lake exe cache get
      - name: Check the measure-theoretic companion
        run: lake build
